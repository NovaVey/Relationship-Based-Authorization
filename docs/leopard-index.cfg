\* TLC configuration for docs/leopard-index.tla -- the REAL, correct design
\* (`Spec`, whose only publication action is the atomic `RebuildCommit`).
\*
\* To reproduce the deliberately-induced counterexample instead (see the
\* .tla module's own "THE DELIBERATELY WEAKENED VARIANT" section and
\* docs/TLA-SPEC-NOTES.md's "COUNTEREXAMPLE"), copy this file and change
\* only the SPECIFICATION line to `SpecWeakened`.
\*
\* Real invocation (confirmed live, 2026-08-29 -- see docs/TLA-SPEC-NOTES.md's
\* "Update" section for the full transcript; tla2tools.jar requires the .tla
\* file's on-disk name to match its module name, so invoke against a copy
\* named leopard_index.tla, not this repo's own leopard-index.tla):
