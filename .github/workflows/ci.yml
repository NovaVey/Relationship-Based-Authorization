name: CI

# D-189 (docs/DECISIONS.md): lint/format/typecheck/test/build (formerly
# separate lint-and-typecheck/test/build jobs) now run via the shared
# NovaVey/.github reusable workflow — see the `verify` job below and that
# decision entry for the required-status-check-rename handling this needed.
# Job ids below (security-audit) are still referenced verbatim in
# docs/github-governance.md as required branch-protection status checks;
# see that doc and D-189 for the `verify` job's own required-check name.
# If you rename a job here, update docs/github-governance.md in the same
# commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Replaces the former separate lint-and-typecheck/test/build jobs — all
  # three folded into the shared reusable workflow's own single `npm run
  # verify` (format:check && lint && typecheck && test && build), which this
  # repo already had as one script. `node-versions` explicit (not the
  # reusable workflow's own `["24", "26"]` default) to match this repo's
  # own single-Node-version-of-record policy (D-188's engines.node floor),
  # not inherit an extra Node 26 leg this repo hasn't separately opted into.
  # `pre-verify` reproduces the former lint-and-typecheck job's own second
  # `npm ci` in tools/rebac-benchmark — needed so typed ESLint can resolve
  # that package's SDK types (see that job's own former comment, preserved
  # in git history) — since `install-command` only ever runs once, against
  # the repo root.
  #
  # Two real, disclosed differences from the jobs this replaces, see D-189
  # for the full reasoning: the `test` step here is a plain `npm test`, not
  # `npm run test:coverage` — this reusable workflow's own `npm run verify`
  # step isn't parameterizable, so coverage collection in CI is dropped,
  # not just unreported; and the D-168 production-dependencies-only build
  # check (no hook point in the reusable workflow for a step that runs
  # *after* its own build) is kept as its own small, separate, local job
  # below instead of folded in.
  verify:
    uses: NovaVey/.github/.github/workflows/node-verify.yml@main
    with:
      node-versions: '["24"]'
      pre-verify: 'npm ci --prefix tools/rebac-benchmark'

  # D-168 (docs/DECISIONS.md): a plain `npm ci` (as the `verify` job above
  # runs, via `install-command`'s own default) installs devDependencies
  # too, so `npm run verify`'s own `build` step can't catch a built command
  # that only works because some devDependency happens to already be in
  # node_modules — exactly what happened to `fast-check` (a real runtime
  # need of `src/cli/index.ts`'s eagerly-imported `soundness` command,
  # misclassified as dev-only) until a genuine production-only install
  # caught it live. Kept as its own job (not a `pre-verify`/post-verify
  # step on `verify` above — that workflow has no hook that runs *after*
  # its own `build`) — a fresh `npm ci --omit=dev` then `npm run build`
  # then run the built CLI, independent of whatever `verify` already did.
  # `--help` needs no DATABASE_URL and no real database — Commander's own
  # module-level command registration already imports every command file
  # (this one included) before it ever parses argv, so this exercises the
  # identical import graph `authz doctor`/`authz serve` would.
  confirm-production-build:
    name: confirm-production-build
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --omit=dev
      - run: npm run build
      - name: Confirm the built CLI starts with only production dependencies installed
        run: node dist/cli/index.js --help

  # Not in the required status checks list — proves the isolation suite's
  # claims against a real Postgres-backed tuple store, not just against a
  # naive in-memory oracle (a real, non-`.todo()` suite as of Phase 2/4;
  # see docs/github-governance.md's own note on full-repo audit finding
  # #18, MEDIUM, 2026-08-16, which corrected this comment's own previously
  # stale "every test here is `.todo()`" framing). Container-based tests
  # carry more infra-flakiness risk than the pure unit suite — that's the
  # actual, still-current reason this stays advisory. ubuntu-latest
  # runners have Docker preinstalled, so no extra setup is needed.
  # Promoting this to required is a manual, deliberate choice — see
  # docs/github-governance.md Step 5.
  #
  # Runs on Node 24, same as the rest of CI now (it wasn't always — this
  # job originally ran Node 22 specifically while the rest of CI still
  # matrixed Node 20/22, because the `testcontainers` devDependency
  # requires Node >=22.22: on 20.x its transitive `undici` throws
  # `webidl.util.markAsUncloneable is not a function` before a single test
  # even runs. That constraint is moot now that Node 20 was dropped
  # everywhere (engines.node is >=24 as of D-188), but is worth keeping in
  # mind if this job's Node version is ever lowered again independently of
  # the rest of CI.
  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run test:integration

  # tools/rebac-benchmark/'s own hygiene check — a genuinely separate npm
  # package (see its own tsconfig.json's "Deliberately standalone" comment:
  # no cross-boundary import of root src/, so this job needs neither the
  # root `npm ci` nor to run inside the same job as the root lint/typecheck
  # steps above, unlike that job's own `tools/rebac-benchmark` install step,
  # which exists only so root-level `eslint .`'s nested-config discovery can
  # resolve this directory's own SDK types). Its 11 unit tests
  # (`prng.test.ts`/`workload.test.ts`) are pure logic — no network calls,
  # no external servers, no Postgres — so running them on every PR costs
  # nothing and closes a real, previously-disclosed gap
  # (`docs/DECISIONS.md`): this suite existed and passed locally since this
  # tool's first commit but was never wired into CI at all, unlike every
  # other piece of shipped code in this repo. Not added to the required
  # status checks list (`docs/github-governance.md` Step 2) — same
  # deliberately-manual promotion posture every other advisory job here
  # already documents; this is a new job, not a rename, so no branch-
  # protection update is needed either way.
  rebac-benchmark:
    name: rebac-benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tools/rebac-benchmark/package-lock.json

      - run: npm ci
        working-directory: tools/rebac-benchmark

      - run: npm run typecheck
        working-directory: tools/rebac-benchmark
      - run: npm test
        working-directory: tools/rebac-benchmark

  # Advisory only: continue-on-error means this job never blocks a merge.
  # Under this repo's "Standard" governance tier (see docs/github-governance.md)
  # it is intentionally NOT added to the required status checks list, so a
  # known-vulnerable dependency surfaces in the PR checks UI without gating
  # merges. See docs/github-governance.md Step 5 for the (deliberately
  # manual) upgrade path, including promoting this job to required. Static
  # analysis (as opposed to dependency-CVE scanning) lives separately in
  # codeql.yml.
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
