name: CodeQL

# Static analysis (SAST) for JS/TS, separate from the `security-audit` job in
# ci.yml (which only checks known-CVE *dependencies*, not code patterns).
# Results land under the repo's Security -> Code scanning alerts tab, not as
# a PR status check — this workflow is intentionally not wired into required
# status checks (see docs/github-governance.md Step 6), matching this repo's
# Standard governance tier. Promoting it to a required check is one of that
# step's stricter-tier options, left to the maintainer to opt into.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push, so a newly-published CodeQL query
    # pack can still surface findings in code that hasn't changed.
    - cron: '30 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: '/language:javascript-typescript'
